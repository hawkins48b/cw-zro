name: CI

# No push trigger for main: deploy-prod.yml calls this workflow there, so a
# trigger here would run it twice.
on:
  pull_request:
  push:
    branches:
      - develop
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      # deploy-prod.yml ships this artifact, so npm never runs in the job that
      # holds the FTP secrets.
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
