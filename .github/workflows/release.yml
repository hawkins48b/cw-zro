name: Release

# A version tag pushed from main builds the desktop installers and publishes
# them as a GitHub release. See docs/deployment.md#desktop-release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One run per tag. A running release is never cancelled; GitHub keeps one
# pending run per group, so a newer run replaces a pending one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # The tag must be v + the package.json version, on a commit that is on main.
  # No npm here.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version package.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)"
            exit 1
          fi

      - name: Tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tagged commit is not on main. Tag a commit of main."
            exit 1
          fi

  # No secrets in this job: the installers are not signed.
  build:
    needs: [ci, check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No npm cache: a release installs from the lockfile only.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      # The web build. Not build:mobile: both write build/.
      - name: Build
        run: npm run build

      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config electron-builder.json --publish never

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist-electron/ZRO-*.exe
            dist-electron/ZRO-*.dmg
            dist-electron/ZRO-*.AppImage
          if-no-files-found: error
          retention-days: 7

  # The only job that can write: no checkout and no npm, only the built files.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true

      # Exactly the four installers of this version, nothing else.
      - name: Check files
        working-directory: installers
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          expected="$(printf '%s\n' "ZRO-$v-win-x64.exe" "ZRO-$v-mac-arm64.dmg" "ZRO-$v-mac-x64.dmg" "ZRO-$v-linux-x86_64.AppImage" | LC_ALL=C sort)"
          actual="$(ls -A | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected installer files"
            printf 'Expected:\n%s\nGot:\n%s\n' "$expected" "$actual"
            exit 1
          fi

      - name: Checksums
        working-directory: installers
        run: |
          sha256sum ZRO-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # gh uploads the files to a draft and publishes it at the end. If an
      # upload fails, delete the draft before re-running this job.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Desktop installers for Windows (NSIS), macOS (dmg, Apple silicon and Intel) and Linux (AppImage).

          **These installers are not signed.** Windows SmartScreen and macOS Gatekeeper warn before the first start. Check the file against `SHA256SUMS.txt`, then see "Unsigned installers" in docs/deployment.md.

          The web app is at the production site. There are no mobile builds in this release.
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ZRO $TAG" \
            --notes-file notes.md \
            installers/*
