name: Deploy FTP

# The deploy steps shared by deploy-prod.yml and deploy-dev.yml. The caller
# runs ci.yml first, which uploads the build artifact, and passes its secrets
# with `secrets: inherit`. See docs/deployment.md#how-a-deploy-runs.
on:
  workflow_call:
    inputs:
      environment:
        description: prod or dev. Picks the GitHub environment and the secrets
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Holds the FTP secrets: no checkout and no npm here, only the tested build.
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      # prod reads FTP_*, dev reads DEV_FTP_*. Never fall back from one set to
      # the other: a dev deploy with the FTP_* secrets would ship develop to
      # production.
      SECRET_PREFIX: ${{ inputs.environment == 'dev' && 'DEV_' || '' }}
    steps:
      # dev without its secrets: a warning, and nothing is uploaded. prod
      # without its secrets fails.
      - name: Check secrets
        id: check
        env:
          TARGET: ${{ inputs.environment }}
          DEPLOY_HOST: ${{ secrets[format('{0}FTP_HOST', env.SECRET_PREFIX)] }}
          DEPLOY_USER: ${{ secrets[format('{0}FTP_USER', env.SECRET_PREFIX)] }}
          # Only whether it is set: the password stays out of this step.
          DEPLOY_PWD_SET: ${{ secrets[format('{0}FTP_PWD', env.SECRET_PREFIX)] != '' }}
          PROD_USER: ${{ secrets.FTP_USER }}
          # Only whether the dev password is the production one.
          SAME_PWD: ${{ secrets.DEV_FTP_PWD != '' && secrets.DEV_FTP_PWD == secrets.FTP_PWD }}
          # The caller's ref: prod only from main, dev only from develop,
          # whatever workflow calls this one.
          REF: ${{ github.ref }}
        run: |
          case "$TARGET:$REF" in
            prod:refs/heads/main|dev:refs/heads/develop) ;;
            *)
              echo "::error::Environment '$TARGET' cannot be deployed from '$REF'. prod deploys from main, dev from develop."
              exit 1
              ;;
          esac

          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ "$DEPLOY_PWD_SET" != 'true' ]; then
            if [ "$TARGET" = dev ]; then
              echo "::warning::The dev secrets DEV_FTP_HOST, DEV_FTP_USER and DEV_FTP_PWD are not all set in the dev environment. Nothing was deployed. See docs/deployment.md#set-up-the-dev-site."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::The secrets FTP_HOST, FTP_USER and FTP_PWD are not all set."
            exit 1
          fi

          # The dev FTP user must not be the production account, whatever
          # name DEV_FTP_HOST gives the server.
          if [ "$TARGET" = dev ] && [ -n "$PROD_USER" ] \
            && [ "$(printf '%s' "$DEPLOY_USER" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$PROD_USER" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::DEV_FTP_USER is the production FTP user. Use an FTP user limited to the dev folder."
            exit 1
          fi
          if [ "$TARGET" = dev ] && [ "$SAME_PWD" = 'true' ]; then
            echo "::error::DEV_FTP_PWD is the production FTP password. Use an FTP user limited to the dev folder."
            exit 1
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Download build
        if: steps.check.outputs.deploy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build

      - name: Deploy via FTP
        if: steps.check.outputs.deploy == 'true'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets[format('{0}FTP_HOST', env.SECRET_PREFIX)] }}
          username: ${{ secrets[format('{0}FTP_USER', env.SECRET_PREFIX)] }}
          password: ${{ secrets[format('{0}FTP_PWD', env.SECRET_PREFIX)] }}
          protocol: ftps
          security: strict
          local-dir: ./build/
          server-dir: /
