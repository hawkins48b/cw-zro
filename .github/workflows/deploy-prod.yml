name: Deploy Prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Queued runs are replaced by newer ones and a running deploy is never
# cancelled. The ref keeps a dispatch from another branch, which deploys
# nothing, from replacing a queued main run.
concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # deploy-ftp.yml holds the FTP secrets: no checkout and no npm there, only
  # the tested build. A missing FTP_* secret fails the run.
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-ftp.yml
    with:
      environment: prod
    secrets: inherit
